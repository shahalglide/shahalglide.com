<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shahalglide.com</title>

<style>
:root{
    --bg-1:#08111d;
    --bg-2:#11253a;
    --glass:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.14);
    --text:#ffffff;
    --muted:rgba(255,255,255,.72);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);

    background:
    radial-gradient(circle at 15% 20%, rgba(80,170,255,.25), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(50,220,180,.18), transparent 35%),
    linear-gradient(135deg,var(--bg-1),var(--bg-2));
}

/* Floating background */

.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
    pointer-events:none;
}

.orb.one{
    width:300px;
    height:300px;
    background:#59c3ff;
    top:-100px;
    left:-100px;
    animation:floatA 12s ease-in-out infinite;
}

.orb.two{
    width:260px;
    height:260px;
    background:#4be6c4;
    bottom:-90px;
    right:-90px;
    animation:floatB 14s ease-in-out infinite;
}

@keyframes floatA{
    50%{
        transform:translate(40px,40px);
    }
}

@keyframes floatB{
    50%{
        transform:translate(-35px,-35px);
    }
}

/* Main card */

.card{
    width:min(900px,92vw);
    padding:clamp(28px,4vw,56px);

    background:var(--glass);
    border:1px solid var(--glass-border);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-radius:32px;

    text-align:center;

    position:relative;
    overflow:hidden;

    transition:
    transform .15s ease,
    border-color .3s ease;
}

.glow{
    position:absolute;
    width:280px;
    height:280px;
    pointer-events:none;

    background:
    radial-gradient(circle,
    rgba(255,255,255,.16),
    transparent 70%);

    transform:translate(-50%,-50%);
}

.domain{
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:3px;
    color:rgba(255,255,255,.55);
    margin-bottom:18px;
}

h1{
    font-size:clamp(2.2rem,7vw,5rem);
    line-height:1;
    font-weight:700;
    margin-bottom:18px;
}

.subtitle{
    max-width:650px;
    margin:0 auto;

    color:var(--muted);

    font-size:clamp(.95rem,2vw,1.1rem);
    line-height:1.75;
}

.line{
    width:80px;
    height:1px;
    margin:30px auto;
    background:rgba(255,255,255,.18);
}

.greeting{
    color:#dcefff;
    margin-bottom:28px;
}

.actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
}

.action-btn{
    text-decoration:none;
    color:white;

    min-width:145px;

    padding:13px 22px;

    border-radius:14px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);

    transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease;
}

.action-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.22);
}

.action-btn:active{
    transform:translateY(0);
}

.footer{
    margin-top:32px;
    font-size:.85rem;
    color:rgba(255,255,255,.45);
}

/* Small devices */

@media (max-height:700px){

    .card{
        padding:24px;
    }

    h1{
        font-size:2rem;
    }

    .subtitle{
        line-height:1.55;
    }

    .line{
        margin:20px auto;
    }

    .footer{
        margin-top:20px;
    }
}

@media (max-width:480px){

    .actions{
        flex-direction:column;
    }

    .action-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<div class="card" id="card">

    <div class="glow" id="glow"></div>

    <div class="domain">
        shahalglide.com
    </div>

    <h1>Well, you found it.</h1>

    <p class="subtitle">
        Thanks for visiting shahalglide.com.
        This website is still being put together,
        but it's nice to have you here.
    </p>

    <div class="line"></div>

    <div class="greeting" id="greeting">
        Welcome.
    </div>

    <div class="actions">

        <a
            href="mailto:contact@shahalglide.com"
            class="action-btn">
            ✉ Email Me
        </a>

        <a
            href="https://contact.shahalglide.com"
            class="action-btn">
            ☏ Contact
        </a>

        <a
            href="https://shahalglide.com"
            class="action-btn">
            ⌂ Home
        </a>

    </div>

    <div class="footer">
        © 2026 Shahal Glide
    </div>

</div>

<script>
const card = document.getElementById("card");
const glow = document.getElementById("glow");

function updateEffect(x,y){

    const rect = card.getBoundingClientRect();

    const px = x - rect.left;
    const py = y - rect.top;

    glow.style.left = px + "px";
    glow.style.top = py + "px";

    const rotateY = ((px / rect.width) - 0.5) * 8;
    const rotateX = -((py / rect.height) - 0.5) * 8;

    card.style.transform =
        `perspective(1200px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)`;
}

window.addEventListener("mousemove",(e)=>{
    updateEffect(e.clientX,e.clientY);
});

window.addEventListener("touchmove",(e)=>{
    if(e.touches.length){
        updateEffect(
            e.touches[0].clientX,
            e.touches[0].clientY
        );
    }
},{passive:true});

window.addEventListener("mouseleave",()=>{
    card.style.transform = "none";
});

const hour = new Date().getHours();
const greeting = document.getElementById("greeting");

if(hour < 12){
    greeting.textContent = "Good morning.";
}
else if(hour < 18){
    greeting.textContent = "Good afternoon.";
}
else{
    greeting.textContent = "Good evening.";
}
</script>

</body>
</html>
