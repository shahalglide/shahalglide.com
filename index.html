<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahal Glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a0f;
  --surface: rgba(18, 20, 31, 0.7);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(59, 130, 246, 0.4);
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  position: relative;
}

/* Ambient Background Lights */
.ambient-glow {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}

.glow-orb {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.12;
  will-change: transform;
}

.orb-1 { background: #3b82f6; top: -150px; left: -150px; }
.orb-2 { background: #8b5cf6; bottom: -150px; right: -150px; }

/* Subtle Grid Matrix */
.matrix-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index: -1;
}

/* Main Layout */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.container {
  max-width: 680px;
  width: 100%;
  background: var(--surface);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: clamp(32px, 5vw, 52px);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  position: relative;
  overflow: hidden;
  animation: containerEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes containerEntrance {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Top Bar: Radar & Status */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.radar-system {
  display: flex;
  align-items: center;
  gap: 10px;
}

.radar-dot {
  width: 8px;
  height: 8px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
  animation: radarPulse 2s infinite;
}

@keyframes radarPulse {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
  70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

/* Typography */
.error-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 12px;
  display: block;
}

h1 {
  font-size: clamp(2.2rem, 4.5vw, 3.8rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 18px;
  background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

p {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.7;
  margin-bottom: 36px;
}

/* Interactive Command Actions */
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 14px 24px;
  border-radius: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  box-shadow: 0 4px 20px var(--accent-glow);
}

.btn-primary:hover {
  background: #2563eb;
  border-color: #2563eb;
  transform: translateY(-2px);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-main);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

/* System Meta Footer inside Card */
.sys-meta {
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: #6b7280;
}

.token-id {
  background: rgba(255, 255, 255, 0.03);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}

.token-id:hover {
  color: var(--text-main);
  border-color: var(--border-hover);
}

/* Bottom Page Footer */
.site-footer {
  padding: 20px 32px;
  border-top: 1px solid var(--border);
  background: rgba(9, 10, 15, 0.8);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.security {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  color: var(--text-main);
}

.security svg {
  width: 16px;
  height: 16px;
}

@media(max-width: 640px) {
  main { padding: 16px; }
  .container { padding: 24px; }
  .site-footer {
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }
}
</style>
</head>
<body>

<div class="ambient-glow">
  <div class="matrix-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
</div>

<main>
  <div class="container">
    <div class="top-bar">
      <div class="radar-system">
        <div class="radar-dot"></div>
        <span id="sys-status">NODE_OFFLINE</span>
      </div>
      <div id="sys-clock">00:00:00 UTC</div>
    </div>

    <span class="error-code">Error 404 // Target Route Missing</span>
    <h1>Destination not found.</h1>
    <p>The routing table doesn't have an entry for this path. The resource may have been relocated, decommissioned, or drifted into deep space.</p>

    <div class="actions">
      <button class="btn btn-primary" onclick="handleRetry()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
        Re-scan Route
      </button>
      <button class="btn btn-secondary" onclick="handleBack()">Return Safe</button>
    </div>

    <div class="sys-meta">
      <div>PROTOCOL: HTTPS</div>
      <div>HASH: <span class="token-id" id="token-id" title="Click to copy hash" onclick="copyToken()">SHAHAL-0X4</span></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>© Shahal Glide 2026</div>
  <div class="security">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path fill="#f38020" d="M48.6 29.4c-.6-4.5-4.4-8.2-9.1-8.2-3.3 0-6.2 1.8-7.8 4.6-.9-.5-1.9-.8-3-.8-3.3 0-6 2.7-6 6 0 .2 0 .4.1.6C18.9 32.3 16 35.8 16 40c0 4.8 3.9 8.7 8.7 8.7h25.1c5.1 0 9.2-4.1 9.2-9.2 0-4.8-3.7-8.8-8.4-9.1z"/>
    </svg>
    <span>Secured by Cloudflare</span>
  </div>
</footer>

<script>
// Live System Clock
function updateClock() {
  const now = new Date();
  const utc = now.toISOString().substr(11, 8) + " UTC";
  document.getElementById("sys-clock").textContent = utc;
}
setInterval(updateClock, 1000);
updateClock();

// Random Token Generator
const tokenEl = document.getElementById("token-id");
const randomHash = "0X" + Math.random().toString(16).substring(2, 8).toUpperCase();
tokenEl.textContent = randomHash;

function copyToken() {
  navigator.clipboard.writeText(tokenEl.textContent);
  const original = tokenEl.textContent;
  tokenEl.textContent = "COPIED!";
  setTimeout(() => tokenEl.textContent = original, 1200);
}

// Interactive Status & Retry Logic
const statusMessages = [
  "NODE_OFFLINE",
  "TIMEOUT_ERR",
  "ROUTE_VOID",
  "SIGNAL_LOST"
];
let statusIdx = 0;
const statusEl = document.getElementById("sys-status");

function handleRetry() {
  statusIdx = (statusIdx + 1) % statusMessages.length;
  statusEl.textContent = statusMessages[statusIdx];
  
  const btn = document.querySelector('.btn-primary');
  btn.style.transform = 'scale(0.96)';
  setTimeout(() => btn.style.transform = '', 150);
}

function handleBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    alert("No previous waypoint recorded in navigation history.");
  }
}
</script>

</body>
</html>
