<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>This Site Doesn't Exist</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#181818;--muted:#707070;--line:#e8e8e8;--accent:#2d6cdf}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-2}
.grid{position:absolute;inset:0;background:
linear-gradient(var(--line) 1px,transparent 1px),
linear-gradient(90deg,var(--line) 1px,transparent 1px);
background-size:48px 48px;opacity:.45}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.13;animation:f 20s ease-in-out infinite}
.b1{width:430px;height:430px;background:#4d7dff;left:-120px;top:-120px}
.b2{width:360px;height:360px;background:#ff8d66;right:-100px;bottom:-90px;animation-duration:24s}
.b3{width:300px;height:300px;background:#4dbb81;left:52%;top:44%;animation-duration:28s}
@keyframes f{50%{transform:translate(70px,-40px) scale(1.15)}}
main{display:flex;align-items:center;justify-content:center;height:100%;padding:32px}
.card{max-width:760px;width:100%;background:#fff;border:1px solid var(--line);border-radius:22px;padding:58px;box-shadow:0 20px 60px rgba(0,0,0,.05);animation:up .8s}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin-bottom:28px}
.dot{width:9px;height:9px;background:var(--accent);border-radius:50%;animation:p 2s infinite}
@keyframes p{50%{transform:scale(1.5);opacity:1}0%,100%{opacity:.7}}
h1{font-size:clamp(2.5rem,5vw,4.7rem);line-height:1;letter-spacing:-2px;margin-bottom:22px}
p{max-width:560px;color:var(--muted);line-height:1.8;font-size:1.06rem}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:38px}
button{font:inherit;padding:14px 24px;border-radius:12px;cursor:pointer;transition:.25s}
.primary{background:#171717;color:#fff;border:none}.primary:hover{transform:translateY(-2px)}
.secondary{background:#fff;border:1px solid var(--line)}.secondary:hover{background:#f3f3f3}
.footer-info{margin-top:46px;color:#9b9b9b;font-size:.88rem}
.site-footer{position:fixed;left:0;right:0;bottom:0;padding:16px 28px;border-top:1px solid rgba(0,0,0,.06);background:rgba(246,246,244,.94);display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:#777}
.security{display:flex;align-items:center;gap:10px;font-weight:500;color:#555}
.security svg{width:20px;height:20px}
.cursor{display:inline-block;width:2px;height:1em;background:#222;animation:b 1s infinite;vertical-align:middle}
@keyframes b{50%{opacity:0}}
@media(max-width:700px){.card{padding:36px}h1{letter-spacing:-1px}.site-footer{flex-direction:column;gap:10px;text-align:center}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main>
<div class="card">
<div class="status"><div class="dot"></div><span id="status">Searching<span class="cursor"></span></span></div>
<h1>This site doesn't exist.</h1> <p>The address you're looking for couldn't be reached. It may have never existed, was removed, or simply jumped out of the browser and ran away.</p>
<div class="actions">
<button class="primary" onclick="location.reload()">Try Again</button>
<button class="secondary" onclick="history.back()">Go Back</button>
</div>
<div class="footer-info">Request ID: <span id="rid"></span></div>
</div>
</main>

<footer class="site-footer">
<div>© Shahal Glide 2026</div>
<div class="security">
<svg viewBox="0 0 64 64" aria-hidden="true">
<path fill="#f38020" d="M48.6 29.4c-.6-4.5-4.4-8.2-9.1-8.2-3.3 0-6.2 1.8-7.8 4.6-.9-.5-1.9-.8-3-.8-3.3 0-6 2.7-6 6 0 .2 0 .4.1.6C18.9 32.3 16 35.8 16 40c0 4.8 3.9 8.7 8.7 8.7h25.1c5.1 0 9.2-4.1 9.2-9.2 0-4.8-3.7-8.8-8.4-9.1z"/>
</svg>
<span>Secured by Cloudflare</span>
</div>
</footer>

<script>
const msgs=["Searching","Resolving domain","Checking route","No response","Unavailable"];
let i=0,s=document.getElementById("status");
setInterval(()=>{i=(i+1)%msgs.length;s.innerHTML=msgs[i]+'<span class="cursor"></span>'},1700);
document.getElementById("rid").textContent=Math.random().toString(36).substring(2,10).toUpperCase();
const blobs=document.querySelectorAll(".blob");
document.addEventListener("mousemove",e=>{
const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
blobs.forEach((b,n)=>b.style.transform=`translate(${x*(n+1)*15}px,${y*(n+1)*15}px)`);
});
</script>
</body>
</html>
