<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Site Doesn't Exist</title>

<style>
:root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --text:#171717;
    --muted:#6f6f6f;
    --line:#e5e5e5;
    --accent:#2d6cdf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    height:100vh;
}

/* Animated background */

.background{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(110px);
    opacity:.14;
    animation:float 18s linear infinite;
}

.blob:nth-child(1){
    width:450px;
    height:450px;
    background:#4677ff;
    left:-100px;
    top:-100px;
}

.blob:nth-child(2){
    width:380px;
    height:380px;
    background:#ff8360;
    right:-120px;
    bottom:-80px;
    animation-duration:22s;
}

.blob:nth-child(3){
    width:300px;
    height:300px;
    background:#45b97c;
    left:55%;
    top:50%;
    animation-duration:26s;
}

@keyframes float{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(80px,-40px) scale(1.15);
}

100%{
transform:translate(0,0) scale(1);
}

}

.grid{
    position:absolute;
    inset:0;
    background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;
    opacity:.4;
}

/* Main */

main{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px;
}

.card{
    max-width:760px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:60px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.05);
    animation:rise .8s ease;
}

@keyframes rise{
from{
opacity:0;
transform:translateY(24px);
}
to{
opacity:1;
transform:none;
}
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:30px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--accent);
    animation:pulse 2s infinite;
}

@keyframes pulse{

0%,100%{
transform:scale(1);
opacity:.7;
}

50%{
transform:scale(1.5);
opacity:1;
}

}

h1{
    font-size:clamp(2.4rem,5vw,4.6rem);
    line-height:1;
    letter-spacing:-2px;
    margin-bottom:24px;
}

p{
    color:var(--muted);
    line-height:1.8;
    font-size:1.05rem;
    max-width:560px;
}

.actions{
    display:flex;
    gap:14px;
    margin-top:40px;
    flex-wrap:wrap;
}

button{
    border:none;
    cursor:pointer;
    font:inherit;
    transition:.25s;
}

.primary{
    background:#171717;
    color:white;
    padding:14px 24px;
    border-radius:12px;
}

.primary:hover{
    transform:translateY(-2px);
}

.secondary{
    background:white;
    border:1px solid var(--line);
    color:#444;
    padding:14px 24px;
    border-radius:12px;
}

.secondary:hover{
    background:#f2f2f2;
}

.footer{
    margin-top:55px;
    font-size:.86rem;
    color:#999;
}

.cursor{
    display:inline-block;
    width:2px;
    height:1em;
    background:#222;
    vertical-align:middle;
    animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

@media(max-width:700px){

.card{
padding:36px;
}

h1{
letter-spacing:-1px;
}

}
</style>
</head>
<body>

<div class="background">
    <div class="grid"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<main>

<div class="card">

<div class="status">
<div class="dot"></div>
<span id="status">Searching</span>
</div>

<h1>This site doesn't exist.</h1>

<p>
The address you're looking for couldn't be reached. It may have never existed,
been moved, or is temporarily unavailable.
</p>

<div class="actions">
<button class="primary" onclick="location.reload()">
Try Again
</button>

<button class="secondary" onclick="history.back()">
Go Back
</button>
</div>

<div class="footer">
Request ID:
<span id="id"></span>
</div>

</div>

</main>

<script>

const messages=[
"Searching",
"Resolving domain",
"Checking route",
"No response",
"Unavailable"
];

let i=0;

const status=document.getElementById("status");

setInterval(()=>{
i=(i+1)%messages.length;
status.innerHTML=messages[i]+'<span class="cursor"></span>';
},1700);

document.getElementById("id").textContent=
Math.random().toString(36).substring(2,10).toUpperCase();

const blobs=document.querySelectorAll(".blob");

document.addEventListener("mousemove",(e)=>{

const x=e.clientX/window.innerWidth-.5;
const y=e.clientY/window.innerHeight-.5;

blobs.forEach((blob,index)=>{

const amount=(index+1)*15;

blob.style.transform=
`translate(${x*amount}px,${y*amount}px)`;

});

});

</script>

</body>
</html>
